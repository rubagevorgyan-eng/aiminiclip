<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recess - Saturday</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
/*
VOICE: Saturday morning, 2004, loud and proud
IDEA: a game portal that looks like the cartoon channel bumpers of the time: thick ink outlines, stickers, sunburst
PICTURE: giant sticker logo over a spinning sunburst, game cards as slapped-on stickers
COLOUR and TYPE: electric blue sky, safety orange, lime, sunshine yellow, black ink. Luckiest Guy for shouting, bold Arial for reading
LAYOUT: logo band, then games left and scores right
*/
:root{--sky:#1f7bff;--sky2:#0e5ce0;--ink:#111;--or:#ff7a00;--lime:#8de000;--sun:#ffd400;--pink:#ff3d8b;--paper:#fff;--disp:"Luckiest Guy",Impact,sans-serif;--body:Arial,Helvetica,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font:700 15px/1.4 var(--body);overflow-x:clip}
.burst{position:fixed;inset:-50%;z-index:-1;background:repeating-conic-gradient(from 0deg,var(--sky) 0 10deg,var(--sky2) 10deg 20deg);animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header{text-align:center;padding:26px 0 8px}
.logo{display:inline-block;font:400 clamp(56px,11vw,110px)/.9 var(--disp);color:var(--sun);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);transform:rotate(-4deg);text-decoration:none;letter-spacing:2px}
.logo:hover{transform:rotate(-2deg) scale(1.03)}
.tabs{display:flex;justify-content:center;gap:10px;margin:18px 0 26px;flex-wrap:wrap}
.tabs a{font:400 22px/1 var(--disp);letter-spacing:1px;color:var(--paper);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-decoration:none;background:var(--or);border:4px solid var(--ink);border-radius:16px;padding:12px 18px 8px;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.tabs a:nth-child(2){background:var(--lime)}.tabs a:nth-child(3){background:var(--pink)}
.tabs a:hover{transform:translateY(-3px)}.tabs a:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:26px;padding-bottom:40px}
.box{background:var(--paper);border:5px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:18px}
.box h2{margin:-6px 0 12px;font:400 30px/1 var(--disp);letter-spacing:1px;color:var(--or);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.games{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g{display:block;text-decoration:none;color:inherit;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--sun);transform:rotate(-1.5deg);transition:transform .12s;box-shadow:5px 5px 0 var(--ink)}
.g:nth-child(2n){transform:rotate(1.5deg);background:var(--lime)}
.g:hover{transform:rotate(0) scale(1.04)}
.g .art{aspect-ratio:4/3;display:grid;place-items:center;position:relative;background:radial-gradient(110% 90% at 50% 10%,#3a2563,#1b1230 70%);border-bottom:4px solid var(--ink)}
.g .art svg{width:46%;shape-rendering:crispEdges}
.g .nm{padding:10px 12px 8px;font:400 24px/1 var(--disp);letter-spacing:1px}
.g .sub{padding:0 12px 12px;font-size:13px}
.g.soon .art{background:repeating-linear-gradient(45deg,#ddd 0 12px,#cfcfcf 12px 24px)}
.g.soon .art span{font:400 60px var(--disp);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.side{display:flex;flex-direction:column;gap:24px}
.lb{list-style:none;margin:0;padding:0;counter-reset:r}
.lb li{counter-increment:r;display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:3px dashed #ddd;font-size:16px}
.lb li:first-child{border-top:0}
.lb li::before{content:counter(r);width:34px;height:34px;flex:none;display:grid;place-items:center;border:3px solid var(--ink);border-radius:50%;background:var(--sun);font:400 18px/1 var(--disp);padding-top:3px}
.lb li:nth-child(2)::before{background:#e6e6e6}.lb li:nth-child(3)::before{background:#f0a35e}
.lb li b{margin-left:auto;font:400 22px/1 var(--disp);letter-spacing:1px}
.me{display:flex;gap:12px;align-items:center}
.pfp{width:60px;height:60px;border:4px solid var(--ink);border-radius:14px;background:var(--pink);display:grid;place-items:center;font:400 34px var(--disp);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.me .u{font:400 24px/1 var(--disp);letter-spacing:1px}
.xp{height:14px;border:3px solid var(--ink);border-radius:8px;margin-top:6px;overflow:hidden;background:#eee}
.xp i{display:block;height:100%;width:62%;background:var(--lime)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{font:400 15px/1 var(--disp);letter-spacing:1px;padding:8px 10px 5px;border:3px solid var(--ink);border-radius:10px;background:var(--sun);transform:rotate(-2deg)}
.badge:nth-child(2){background:var(--lime);transform:rotate(2deg)}
.badge.lock{background:#ddd;color:#888}
.note{font-size:11px;color:#777;margin:10px 0 0;font-weight:400}
@media(max-width:820px){.cols{grid-template-columns:1fr}.games{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.games{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.burst{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="burst" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <a class="logo" href="/lab/">RECESS</a>
    <nav class="tabs"><a href="#">Games</a><a href="#">High Scores</a><a href="#">My Recess</a></nav>
  </header>
  <div class="cols">
    <section class="box">
      <h2>Games</h2>
      <div class="games">
        <a class="g" href="/games/needle-drop/"><div class="art"><svg viewBox="0 0 24 24" data-rec></svg></div><div class="nm">Needle Drop</div><div class="sub">Half a second. Name the song.</div></a>
        <div class="g soon"><div class="art"><span>?</span></div><div class="nm">Coming Soon</div><div class="sub">We're cooking.</div></div>
      </div>
    </section>
    <aside class="side">
      <section class="box">
        <h2>High Scores</h2>
        <ol class="lb"><li>@ruben <b>1,240</b></li><li>@jayy <b>980</b></li><li>@mari <b>710</b></li><li>@dev <b>655</b></li></ol>
        <p class="note">Sample scores.</p>
      </section>
      <section class="box">
        <div class="me"><div class="pfp">R</div><div style="flex:1"><div class="u">@ruben</div><div style="font-size:13px">Level 3</div><div class="xp"><i></i></div></div></div>
        <div class="badges"><span class="badge">First Drop</span><span class="badge">Half-Second Club</span><span class="badge lock">???</span></div>
        <p class="note">Sample profile. Accounts come next.</p>
      </section>
    </aside>
  </div>
</div>
<script>
{
  const P={o:'#0b0814',g1:'#2a2340',g2:'#1a1528',r:'#ff4b3e',rd:'#b3261d',y:'#ffcc33'};let out='';const c=11.5;
  for(let y=0;y<24;y++)for(let x=0;x<24;x++){const d=Math.hypot(x-c,y-c);if(d>12)continue;const a=Math.atan2(y-c,x-c);let f;if(d>11||d<1.3)f=P.o;else if(d<4.6)f=(a>0&&a<1.2)?P.y:(x<c?P.rd:P.r);else if(d<5.4)f=P.o;else f=(Math.floor(d*1.2)%2)?P.g1:P.g2;out+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${f}"/>`}
  document.querySelectorAll('[data-rec]').forEach(s=>s.innerHTML=out);
}
</script>
</body>
</html>
