<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recess - 20 logo options</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Rubik:wght@900&family=Krona+One&family=Anton&family=Space+Grotesk:wght@700&family=Yellowtail&family=UnifrakturCook:wght@700&family=Silkscreen:wght@700&family=Saira+Stencil+One&family=Rubik+Bubbles&family=JetBrains+Mono:wght@800&family=Syne:wght@800&family=Bowlby+One&family=Dela+Gothic+One&family=Bebas+Neue&family=Archivo:wght@400;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: a wall of options, no commentary
IDEA: twenty wordmarks and marks, each one confident with a single twist
PICTURE: the marks
COLOUR and TYPE: black or bone ground, ember used once per mark at most
LAYOUT: 4-column grid of numbered tiles, one toggle for light or dark
*/
:root{--bg:#07080d;--tile:#11131f;--line:#1e2133;--ink:#f1ede6;--dim:#868aa3;--ember:#ff4d2e}
body.light{--bg:#e9e5dd;--tile:#f6f3ee;--line:#d6d1c7;--ink:#0a0a0a;--dim:#6b6f80}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Archivo,system-ui,sans-serif;transition:background .2s}
main{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{margin:0;font:700 22px Archivo,sans-serif}
.hd p{margin:4px 0 0;color:var(--dim)}
button{font:700 14px Archivo,sans-serif;padding:10px 16px;border:1px solid var(--line);background:var(--tile);color:var(--ink);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.t{background:var(--tile);border:1px solid var(--line);aspect-ratio:4/3;position:relative;display:grid;place-items:center;overflow:hidden;padding:14px}
.t .n{position:absolute;top:10px;left:12px;font:700 13px Archivo,sans-serif;color:var(--dim)}
.m{line-height:1;white-space:nowrap;color:var(--ink)}
.e{color:var(--ember)}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="hd"><div><h1>20 options</h1><p>Point at numbers. Mixing is fine ("12's letters with 5's dot").</p></div><button id="tg">Switch to light</button></div>
<div class="grid">
  <div class="t"><span class="n">1</span><span class="m" style="font:400 46px 'Archivo Black';letter-spacing:-2px">RECESS</span></div>
  <div class="t"><span class="n">2</span><span class="m" style="font:900 52px Rubik;letter-spacing:-2.5px">recess</span></div>
  <div class="t"><span class="n">3</span><span class="m" style="font:400 30px 'Krona One';letter-spacing:1px">RECESS</span></div>
  <div class="t"><span class="n">4</span><span class="m" style="font:400 58px/0.86 Anton;text-align:center">REC<br>ESS</span></div>
  <div class="t"><span class="n">5</span><span class="m" style="font:700 52px 'Space Grotesk';letter-spacing:-2px">recess<span class="e">.</span></span></div>
  <div class="t"><span class="n">6</span><span class="m" style="font:400 60px Anton;letter-spacing:3px">RCSS</span></div>
  <div class="t"><span class="n">7</span><span class="m" style="font:400 58px Yellowtail;transform:rotate(-8deg)">Recess</span></div>
  <div class="t"><span class="n">8</span><span class="m" style="font:700 56px UnifrakturCook">Recess</span></div>
  <div class="t"><span class="n">9</span><span class="m" style="font:700 34px Silkscreen;letter-spacing:1px">RECESS</span></div>
  <div class="t"><span class="n">10</span><span class="m" style="font:400 52px 'Archivo Black';letter-spacing:-1px;color:transparent;-webkit-text-stroke:2px var(--ink)">RECESS</span></div>
  <div class="t"><span class="n">11</span><span class="m" style="font:400 50px 'Saira Stencil One'">RECESS</span></div>
  <div class="t"><span class="n">12</span><span class="m" style="font:400 46px 'Rubik Bubbles'">recess</span></div>
  <div class="t"><span class="n">13</span><span class="m" style="font:800 40px 'JetBrains Mono';letter-spacing:-1px">recess<span class="e">_</span></span></div>
  <div class="t"><span class="n">14</span><span class="m" style="font:400 46px 'Archivo Black';letter-spacing:-2px">RECES<span style="display:inline-block;transform:scaleX(-1)">S</span></span></div>
  <div class="t"><span class="n">15</span><span class="m" style="font:900 54px Rubik;letter-spacing:-2px">re<span style="display:inline-block;transform:rotate(-14deg) translateY(-3px)">c</span>ess</span></div>
  <div class="t"><span class="n">16</span>
    <svg viewBox="0 0 120 120" width="150" height="150" aria-label="Circular seal">
      <defs><path id="ring" d="M60 60 m-44 0 a44 44 0 1 1 88 0 a44 44 0 1 1 -88 0"/></defs>
      <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="3" style="color:var(--ink)"/>
      <text font-family="Archivo Black" font-size="12.5" letter-spacing="3.2" fill="currentColor" style="color:var(--ink)"><textPath href="#ring">RECESS &#8226; RECESS &#8226; RECESS &#8226; </textPath></text>
      <text x="60" y="74" text-anchor="middle" font-family="Anton" font-size="40" fill="#ff4d2e">R</text>
    </svg></div>
  <div class="t"><span class="n">17</span><span class="m" style="font:800 56px Syne;letter-spacing:-2px">recess</span></div>
  <div class="t"><span class="n">18</span><span class="m" style="font:400 44px 'Bowlby One';letter-spacing:-1px">RECESS</span></div>
  <div class="t"><span class="n">19</span><span class="m" style="font:400 40px 'Dela Gothic One'">RECESS</span></div>
  <div class="t"><span class="n">20</span><span style="display:grid;place-items:center;width:110px;height:110px;background:var(--ember);color:#0a0a0a;font:400 84px/1 'Bebas Neue';padding-top:8px">R</span></div>
</div>
</main>
<script>
{
  const b=document.getElementById('tg');
  b.onclick=()=>{document.body.classList.toggle('light');b.textContent=document.body.classList.contains('light')?'Switch to dark':'Switch to light'};
}
</script>
</body>
</html>
